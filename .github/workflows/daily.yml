name: CSE Daily Newspaper
on:
  schedule:
    # Starts 07:27 IST (not :00, because GitHub is busiest at the start of each hour).
    # The email usually arrives around 08:00 IST.
    - cron: '27 7 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:
    inputs:
      mode:
        description: 'live = real newspaper | demo = fake news test | test-llm = test AI keys'
        type: choice
        options: [live, demo, test-llm]
        default: live
permissions:
  contents: write
jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install libraries
        run: pip install -r requirements.txt
      - name: Run the newspaper robot
        id: robot
        env:
          MODE: ${{ inputs.mode || 'live' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py --mode "$MODE"
      - name: Keep a copy of the PDF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newspaper-${{ github.run_number }}
          path: output/*.pdf
          retention-days: 14
          if-no-files-found: ignore
      - name: Remember today's stories (avoids repeats tomorrow)
        if: success() && (inputs.mode == 'live' || github.event_name == 'schedule')
        run: |
          git config user.name "newspaper-bot"
          git config user.email "newspaper-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen stories" && git push)
      - name: Alert me if a step before the robot crashed
        if: >
          failure() && steps.robot.outcome != 'failure' &&
          (inputs.mode == 'live' || github.event_name == 'schedule')
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 alert.py "A step before the robot failed (for example installing libraries)."
